name: Release (Windows installer)

# Tag a version (v0.1.0) and this builds the Windows installer with ffmpeg and
# the embedded Python inside, then publishes it to the GitHub release. The
# installed app checks that release feed for updates when it has internet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/make-icon.js
      - run: node scripts/fetch-ffmpeg.js
      - run: node scripts/build-python.js
      - run: npm run build
      # electron-builder uploads the installer, the update feed and the
      # blockmap in parallel, and when no release exists yet each upload can
      # create its own. Making the release first means they all land on it.
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ github.ref_name }}" > $null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Falcon Scale Station ${{ github.ref_name }}"
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - name: Remove duplicate releases for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tidy-releases.js "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer
          path: dist/*.exe
          if-no-files-found: ignore
